[package]
name = "mimir-core"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mimir-proto = { path = "../proto" }
mimir-link = { path = "../link" }
mimir-store = { path = "../store" }
mimir-hub = { path = "../hub" }
# Draws Claude Code's own screen for "Phone too" (a terminal view).
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
# Signs the token request for wake-up pushes (RS256); already used by the link.
ring = "0.17"
base64 = "0.22"
# Reads the text of PDFs, and the zip and XML inside Word, Excel and other documents (readfile.rs).
lopdf = { version = "0.42", default-features = false }
flate2 = "1"
roxmltree = "0.21"
# Cleans pictures (pictures.rs).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Takes private words out of a problem report (scrub.rs).
regex = "1"

[[bin]]
name = "fake-claude"
path = "src/bin/fake-claude.rs"
test = false
